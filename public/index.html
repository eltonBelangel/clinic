<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Patient Records Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%237d9b4b%27/%3E%3Cpath d=%27M12 6v12M6 12h12%27 stroke=%27white%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span><div><b>Clinic Dashboard</b><small>Patient records</small></div></div>
  <nav><a class="on" href="#"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Dashboard</a><a href="#patients" onclick="document.getElementById('q').focus()"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>Patients</a></nav>
  <p class="foot">Express.js + MySQL</p>
</aside>

<main>
  <header class="top">
    <div><h1>Patient records</h1><p id="today"></p></div>
    <button class="btn" id="addBtn">Add patient</button>
  </header>

  <section class="stats" id="stats"></section>

  <section class="panel" id="patients">
    <div class="tools">
      <input id="q" type="search" placeholder="Search name, diagnosis or phone">
      <select id="f"><option value="">All statuses</option><option>Active</option><option>Follow-up</option><option>Discharged</option></select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Patient</th><th>Age</th><th>Phone</th><th>Diagnosis</th><th>Status</th><th>Last visit</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>No patients found. Add your first patient to get started.</p>
  </section>
</main>

<dialog id="dlg">
  <form id="form">
    <h2 id="dlgTitle">Add patient</h2>
    <input type="hidden" id="id">
    <label>Full name<input id="full_name" required></label>
    <div class="two">
      <label>Age<input id="age" type="number" min="0" max="130" required></label>
      <label>Gender<select id="gender"><option>Female</option><option>Male</option><option>Other</option></select></label>
    </div>
    <div class="two">
      <label>Phone<input id="phone"></label>
      <label>Visit date<input id="visit_date" type="date" required></label>
    </div>
    <label>Address<input id="address"></label>
    <label>Diagnosis<input id="diagnosis"></label>
    <label>Status<select id="status"><option>Active</option><option>Follow-up</option><option>Discharged</option></select></label>
    <p class="err" id="err" hidden></p>
    <div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" type="submit">Save patient</button></div>
  </form>
</dialog>

<dialog id="del">
  <h2>Delete patient?</h2>
  <p id="delMsg"></p>
  <div class="actions"><button class="btn ghost" id="delNo">Keep</button><button class="btn danger" id="delYes">Delete patient</button></div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
